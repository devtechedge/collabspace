<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e17" />
    <meta name="description" content="CollabSpace — real-time multiplayer collaborative whiteboard" />
    <title>CollabSpace</title>
    <script>
      // Anti-flash: set data-theme before paint based on stored preference or OS.
      (function () {
        try {
          var stored = localStorage.getItem("collabspace.theme");
          if (stored !== "light" && stored !== "dark") {
            stored = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", stored);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", stored === "light" ? "#f8fafc" : "#0a0e17");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
